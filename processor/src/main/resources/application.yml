server:
  port: 8091

spring:
  application:
    name: processor
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5440/smarthome
    username: smarthome
    password: smarthome
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: smarthome
    password: smarthome
    listener:
      simple:
        prefetch: 1000

processor:
  batch-size: 500
  batch-timeout-millis: 1000
  aggregation:
    lookback-minutes: 5
    minute-delay-millis: 60000
    hour-delay-millis: 600000
  retention:
    raw-hours: 24
    cleanup-delay-millis: 3600000
  rules:
    refresh-delay-millis: 15000
    silence-seconds: 60
    silence-check-delay-millis: 30000
  notification:
    webhook-url: 

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
