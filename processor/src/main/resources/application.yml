server:
  port: 8091

spring:
  application:
    name: processor
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5440/smarthome
    username: smarthome
    password: smarthome
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: smarthome
    password: smarthome
    listener:
      simple:
        prefetch: 1000

processor:
  batch-size: 500
  batch-timeout-millis: 1000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
